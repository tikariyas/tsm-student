name: Build APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Install dependencies
        run: npm install

      - name: Prepare Libraries
        run: |
          if [ -f "prepare-libs.js" ]; then
            node prepare-libs.js
          fi

      - name: Initialize Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync web assets to Capacitor
        run: npx cap sync android

      - name: Apply Custom Icons and Assets
        run: |
          if [ -f "apply-assets.js" ]; then
            node apply-assets.js
          fi

      - name: Configure fixed debug keystore
        run: |
          mkdir -p ~/.android
          if [ -f "debug.keystore" ]; then
            cp debug.keystore ~/.android/debug.keystore
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk tsm-student.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tsm-student-debug-apk
          path: tsm-student.apk
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tsm-student.apk
          name: TSM Student App (${{ github.ref_name }})
          body: |
            ### What's New
            - Latest APK build for **Tikariya's School of Music (Student App)**.
            - Tap `tsm-student.apk` below to download and install directly on Android.
